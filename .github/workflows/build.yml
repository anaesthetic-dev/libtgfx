name: Build TGFX with ANGLE

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

concurrency:
  group: tgfx-windows-release

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tgfx
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Tencent/tgfx
          ref: main
          path: tgfx
          lfs: true
          persist-credentials: false

      - name: Install depsync
        shell: bash
        run: npm install -g depsync

      - name: Sync TGFX dependencies
        shell: bash
        run: depsync

      - name: Install prebuilt static ANGLE
        shell: pwsh
        run: |
          $tag = 'angle-8cf70e669c5e'
          $url = "https://github.com/anaesthetic-dev/libangle/releases/download/$tag/angle-windows-x64-static.zip"
          Invoke-WebRequest $url -OutFile angle.zip
          if ((Get-FileHash angle.zip).Hash -ne 'A629BCD528D2E78FAFD24421CD9CCF9F3AA3EEC31F63BDF0262E006F73B786C4') {
            throw 'Unexpected SHA-256 for the ANGLE archive'
          }
          Expand-Archive angle.zip static-angle
          Remove-Item vendor/angle/win/x64, vendor/angle/include -Recurse
          New-Item -ItemType Directory vendor/angle/win/x64 | Out-Null
          Copy-Item static-angle/lib/libEGL_static.lib, static-angle/lib/libGLESv2_static.lib vendor/angle/win/x64/
          Copy-Item static-angle/include vendor/angle/include -Recurse
          Add-Content CMakeLists.txt "`ntarget_compile_definitions(tgfx PRIVATE ANGLE_STATIC=1 ANGLE_EXPORT= EGLAPI= GL_APICALL= GL_API=)"

      - name: Configure the dynamic CRT for vendor builds
        shell: pwsh
        run: |
          $path = 'third_party/vendor_tools/lib/CMake.js'
          $source = Get-Content $path -Raw
          $flag = '"-DCMAKE_C_FLAGS_RELEASE=/Zc:inline"'
          if (!$source.Contains($flag)) { throw 'vendor_tools Windows CMake arguments changed' }
          $source.Replace($flag, '"-DCMAKE_POLICY_DEFAULT_CMP0091=NEW", "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL", ' + $flag) |
            Set-Content $path -NoNewline

      - name: Build static library
        shell: bash
        run: |
          node build_tgfx -p win -a x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DTGFX_USE_ANGLE=ON -DTGFX_BUILD_LAYERS=ON -DTGFX_BUILD_SVG=ON -DTGFX_BUILD_PDF=ON -o ./out/release/win

      - name: Package library and headers
        shell: pwsh
        run: |
          $libraries = @(Get-ChildItem out/release/win -Recurse -File -Filter tgfx.lib)
          if ($libraries.Count -ne 1) { throw "Expected one tgfx.lib, found $($libraries.Count)" }
          New-Item -ItemType Directory -Path package/lib | Out-Null
          Copy-Item $libraries[0].FullName package/lib/
          Copy-Item include package/ -Recurse
          Copy-Item LICENSE.txt package/
          Copy-Item static-angle/include/* package/include/ -Recurse
          Copy-Item static-angle/LICENSE package/LICENSE-ANGLE.txt
          Copy-Item static-angle/BUILD_INFO.txt package/ANGLE-BUILD-INFO.txt
          Compress-Archive -Path package/* -DestinationPath tgfx-windows-x64-angle.zip

      - name: Test packaged library
        shell: pwsh
        run: |
          Expand-Archive tgfx-windows-x64-angle.zip smoke-package
          cmake -S ../tests -B smoke-build -G "Visual Studio 17 2022" -A x64 "-DTGFX_PACKAGE=$PWD/smoke-package"
          cmake --build smoke-build --config Release
          ctest --test-dir smoke-build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: tgfx-windows-x64-angle
          path: tgfx/tgfx-windows-x64-angle.zip
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), '(?m)^set\(TGFX_VERSION\s+"([^"]+)"\)').Groups[1].Value
          if (!$version) { throw 'TGFX_VERSION was not found in CMakeLists.txt' }
          $tag = "v$version-$($sha.Substring(0, 12))"
          $zip = 'tgfx-windows-x64-angle.zip'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $repo --clobber
          } else {
            gh release create $tag $zip --repo $repo --target $env:GITHUB_SHA `
              --title "TGFX $tag for Windows x64" `
              --notes "TGFX source: https://github.com/Tencent/tgfx/commit/$sha"
          }
          exit $LASTEXITCODE
